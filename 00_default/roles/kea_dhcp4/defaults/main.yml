---
# Defaults for the kea_dhcp4 role.
kea_dhcp4_conf_dest: /etc/kea/kea-dhcp4.conf
kea_dhcp4_interfaces: []
kea_dhcp4_lfc_interval: 3600
kea_dhcp4_valid_lifetime: 28800    # 8 hours
kea_dhcp4_renew_timer: 14400       # 4 hours
kea_dhcp4_rebind_timer: 25200      # 7 hours
kea_dhcp4_option_data: []
kea_dhcp4_subnets: []
kea_dhcp4_log_severity: INFO