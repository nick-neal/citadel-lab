---
# Docker's Debian/Ubuntu guide: key in /etc/apt/keyrings/docker.asc and a
# deb822 source file in /etc/apt/sources.list.d/docker.sources.

- name: Install ca-certificates
  ansible.builtin.apt:
    name: ca-certificates
    state: present

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ docker__repo_distros[ansible_facts.distribution] }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker__apt_key

- name: Add Docker's apt source
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker__apt_source

# Also refreshed while docker-ce isn't installed, so a run that failed after
# adding the repo (but before installing) still finds the packages next time.
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
  when: >-
    docker__apt_key is changed or docker__apt_source is changed
    or 'docker-ce' not in ansible_facts.packages