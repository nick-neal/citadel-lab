---
# Defaults for the openvpn_server role.
#
# Builds a certificate authority on the host, runs an OpenVPN server on it,
# and makes a .ovpn profile for every client in openvpn_server_clients.
# Your values go in the inventory, usually inventory/host_vars/<router>.yml.

# ---- listener ----
openvpn_server_port: 1194
openvpn_server_proto: udp
openvpn_server_dev: tun0            # fixed name, so the firewall can match it

# ---- tunnel network ----
# Pool handed to clients; the server takes the first address (.1).
# Must match the VPN zone's networks in nftables_zones.
openvpn_server_network: 10.200.0.0/24

# ---- what clients get ----
# Networks routed over the VPN (split tunnel), e.g. [10.100.0.0/24, 172.20.1.0/24]
openvpn_server_push_routes: []
# DNS servers and search domain pushed to clients
openvpn_server_dns: []
openvpn_server_domain: ""
# true = full tunnel: ALL client traffic goes through the server
openvpn_server_redirect_gateway: false
# false = client <-> client traffic goes through the kernel and your firewall
openvpn_server_client_to_client: false

# ---- clients ----
# Address clients dial: public IP / DNS name (port-forwarded to this host).
# Required once there are clients.
openvpn_server_remote: ""
#
# openvpn_server_clients:
#   - name: alice-laptop
#   - name: admin-laptop
#     ip: 10.200.0.10        # fixed address (for per-client firewall rules)
#   - name: old-phone
#     state: absent          # revokes the certificate, deletes the profile
openvpn_server_clients: []

# Copy each client's .ovpn back to the machine running Ansible.
# The files contain private keys: keep the folder out of git.
openvpn_server_fetch_profiles: true
openvpn_server_fetch_dir: "{{ playbook_dir }}/vpn-clients"

# ---- certificate authority ----
# Protects the CA key on the host. Required unless openvpn_server_ca_nopass
# is true. Keep it in Ansible Vault:
#   openvpn_server_ca_passphrase: "{{ vault_openvpn_server_ca_passphrase }}"
openvpn_server_ca_passphrase: ""
# true = no passphrase: the CA key is stored unencrypted on the host, so anyone
# with root there can issue certificates. Fine for a lab, not for production.
# Only takes effect when the CA is first built; changing it later means
# rebuilding the CA (and re-issuing every client profile).
openvpn_server_ca_nopass: false
openvpn_server_ca_name: OpenVPN CA
openvpn_server_pki_dir: /etc/openvpn/easy-rsa
# An expired CRL blocks EVERY client, so give it a long life
openvpn_server_crl_days: 3650

# ---- crypto ----
openvpn_server_data_ciphers: AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
openvpn_server_tls_version_min: "1.2"