- name: test netplan
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    netplan_interfaces:
      ens18:  
        dhcp4: true
      ens19:
        dhcp4: false
    netplan_vlans:
      ens19.10:
        id: 10
        link: ens19
        addresses: [10.100.0.1/24]
      ens19.20:
        id: 20
        link: ens19
        addresses: [172.20.0.1/24]
  roles:
    - netplan  