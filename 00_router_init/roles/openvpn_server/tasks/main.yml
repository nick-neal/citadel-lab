---
- name: Check this is a supported distro
  ansible.builtin.assert:
    that: ansible_facts.os_family in ['Debian']
    fail_msg: "openvpn_server supports Debian/Ubuntu and RHEL-family hosts, not {{ ansible_facts.os_family }}"
    quiet: true

- name: Load distro-specific paths and users
  ansible.builtin.include_vars: "{{ ansible_facts.os_family }}.yml"

- name: Check the inventory settings
  ansible.builtin.assert:
    that:
      - openvpn_server_ca_nopass or openvpn_server_ca_passphrase | length >= 4
      - openvpn_server_network is match('^\d+\.\d+\.\d+\.\d+/\d+$')
      - openvpn_server_clients | rejectattr('name', 'defined') | list | length == 0
      - openvpn_server_clients | rejectattr('name', 'match', '^[A-Za-z0-9._-]+$') | list | length == 0
      - openvpn_server_clients | map(attribute='name') | unique | list | length == openvpn_server_clients | length
      - openvpn_server_clients | length == 0 or openvpn_server_remote | length > 0
    fail_msg: >-
      Set openvpn_server_ca_passphrase (4+ characters, from Ansible Vault)
      or openvpn_server_ca_nopass: true,
      openvpn_server_network as a CIDR (10.200.0.0/24), and
      openvpn_server_remote once you have clients. Client names must be
      unique and use only letters, digits, . _ -
    quiet: true

# If the nftables role manages this host, the VPN zone must agree with us.
- name: Check the firewall has a matching VPN zone
  ansible.builtin.assert:
    that:
      - nftables_zones | selectattr('interface', 'eq', openvpn_server_dev) | list | length == 1
      - openvpn_server_network in (nftables_zones | selectattr('interface', 'eq', openvpn_server_dev) | first).networks
    fail_msg: >-
      nftables_zones needs a zone with interface: {{ openvpn_server_dev }} and
      {{ openvpn_server_network }} in its networks, or VPN traffic is dropped.
    quiet: true
  when: nftables_zones is defined

# RHEL 8/9 and clones get OpenVPN and easy-rsa from EPEL.
- name: Enable EPEL (RHEL-family 8/9)
  ansible.builtin.dnf:
    name: >-
      {{ 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-'
         ~ ansible_facts.distribution_major_version ~ '.noarch.rpm'
         if ansible_facts.distribution == 'RedHat' else 'epel-release' }}
    state: present
    disable_gpg_check: "{{ ansible_facts.distribution == 'RedHat' }}"
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution != 'Fedora'
    - ansible_facts.distribution_major_version | int < 10

- name: Install OpenVPN and easy-rsa
  ansible.builtin.package:
    name: [openvpn, easy-rsa]
    state: present

# easy-rsa reads the CA passphrase from this file. It exists only for the
# duration of the run and is removed even if a step fails. Two identical lines:
# when openssl gets the same file for -passin and -passout it reads one each.
- name: Build PKI and clients with the CA passphrase available
  vars:
    openvpn_server__pass_file: /run/openvpn-server-ca.pass
  block:
    - name: Write the CA passphrase file
      ansible.builtin.copy:
        content: "{{ openvpn_server_ca_passphrase }}\n{{ openvpn_server_ca_passphrase }}\n"
        dest: "{{ openvpn_server__pass_file }}"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      no_log: true

    - name: Certificate authority and server certificate
      ansible.builtin.import_tasks: pki.yml

    - name: Create client config directory (fixed client addresses)
      ansible.builtin.file:
        path: /etc/openvpn/server/ccd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write server.conf
      ansible.builtin.template:
        src: server.conf.j2
        dest: /etc/openvpn/server/server.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart openvpn-server

    - name: Clients
      ansible.builtin.import_tasks: clients.yml

  always:
    - name: Remove the CA passphrase file
      ansible.builtin.file:
        path: "{{ openvpn_server__pass_file }}"
        state: absent
      changed_when: false

- name: Enable and start the OpenVPN server
  ansible.builtin.systemd:
    name: openvpn-server@server
    enabled: true
    state: started