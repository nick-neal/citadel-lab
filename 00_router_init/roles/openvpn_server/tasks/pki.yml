---
# One-time PKI build, then the server's files copied where server.conf reads
# them. Every step is guarded by "creates", so reruns change nothing.
#
# The CA passphrase reaches easy-rsa as a root-only file in /run (written and
# removed by main.yml), never on a command line or in an environment variable:
# Ansible puts "environment:" values on the remote command line, where they
# show up in -vvv output and the process list.
# EASYRSA_PASSOUT is only set for build-ca: if it's set while building a
# "nopass" key, easy-rsa encrypts that key anyway.

- name: Create PKI directory
  ansible.builtin.file:
    path: "{{ openvpn_server_pki_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy easy-rsa into the PKI directory
  ansible.builtin.command: cp -rL {{ openvpn_server_easyrsa_src }}/. {{ openvpn_server_pki_dir }}/
  args:
    creates: "{{ openvpn_server_pki_dir }}/easyrsa"

- name: Initialise the PKI
  ansible.builtin.command: ./easyrsa init-pki
  args:
    chdir: "{{ openvpn_server_pki_dir }}"
    creates: "{{ openvpn_server_pki_dir }}/pki"
  environment:
    EASYRSA_BATCH: "1"

# With openvpn_server_ca_nopass the CA key is left unencrypted, and PASSOUT
# must be empty (if set, easy-rsa encrypts the key despite "nopass"). The other
# steps still pass the (then empty) passphrase file; openssl ignores it for an
# unencrypted key.
- name: Build the certificate authority
  ansible.builtin.command: ./easyrsa build-ca{{ ' nopass' if openvpn_server_ca_nopass else '' }}
  args:
    chdir: "{{ openvpn_server_pki_dir }}"
    creates: "{{ openvpn_server_pki_dir }}/pki/ca.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: ec
    EASYRSA_REQ_CN: "{{ openvpn_server_ca_name }}"
    EASYRSA_PASSIN: "file:{{ openvpn_server__pass_file }}"
    EASYRSA_PASSOUT: "{{ '' if openvpn_server_ca_nopass else 'file:' ~ openvpn_server__pass_file }}"

- name: Build the server certificate
  ansible.builtin.command: ./easyrsa build-server-full server nopass
  args:
    chdir: "{{ openvpn_server_pki_dir }}"
    creates: "{{ openvpn_server_pki_dir }}/pki/issued/server.crt"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_ALGO: ec
    EASYRSA_PASSIN: "file:{{ openvpn_server__pass_file }}"

- name: Create the revocation list
  ansible.builtin.command: ./easyrsa gen-crl
  args:
    chdir: "{{ openvpn_server_pki_dir }}"
    creates: "{{ openvpn_server_pki_dir }}/pki/crl.pem"
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_CRL_DAYS: "{{ openvpn_server_crl_days }}"
    EASYRSA_PASSIN: "file:{{ openvpn_server__pass_file }}"

- name: Create the server directory
  ansible.builtin.file:
    path: /etc/openvpn/server
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate the tls-crypt key
  ansible.builtin.command: openvpn --genkey secret /etc/openvpn/server/tls-crypt.key
  args:
    creates: /etc/openvpn/server/tls-crypt.key

- name: Install the server's certificates and keys
  ansible.builtin.copy:
    src: "{{ openvpn_server_pki_dir }}/pki/{{ item.src }}"
    dest: /etc/openvpn/server/{{ item.dest }}
    remote_src: true
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: ca.crt, dest: ca.crt, mode: "0644" }
    - { src: issued/server.crt, dest: server.crt, mode: "0644" }
    - { src: private/server.key, dest: server.key, mode: "0600" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart openvpn-server

- name: Lock down the tls-crypt key
  ansible.builtin.file:
    path: /etc/openvpn/server/tls-crypt.key
    owner: root
    group: root
    mode: "0600"

# The revocation list (crl.pem) is installed by clients.yml, after any
# revocations in this run.