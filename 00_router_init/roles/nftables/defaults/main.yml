---
# Defaults for the nftables role.
#
# The firewall is built from ZONES. Each zone is one interface; every new
# forwarded connection runs from_<source zone>, then to_<destination zone>
# (same model as the hand-written config). Everything about YOUR network goes
# in the inventory, usually inventory/host_vars/<router>.yml.

# ---- zones ----
# Required. Each zone:
#   name:         lowercase, letters/digits/_ (becomes $NAME_IF and $NAME_NET)
#   interface:    ens34, tun0, ...
#   networks:     list of networks that live behind this interface
#   inside:       true for your own networks (VLANs, VPN), false for the WAN.
#                 Inside zones make up $INSIDE_IFS / $INSIDE_NETS.
#   from_rules:   rules for what this zone may SEND   (drop / return)
#   to_rules:     rules for what this zone may RECEIVE (accept / drop)
#   from_policy:  open | locked   (locked = log + drop what isn't returned)
#   to_policy:    open | locked   (open = accept anything from inside zones)
#
# nftables_zones:
#   - name: wan
#     interface: ens33
#     networks: [192.168.0.0/16]
#     inside: false
#   - name: vlan10
#     interface: ens34
#     networks: [10.100.0.0/24]
#     inside: true
#     to_rules:
#       - iifname $VLAN20_IF ip daddr 10.100.0.10 udp dport 53 accept
#     to_policy: locked
nftables_zones: []

# Extra defines for use in rules, e.g. { DC: 10.100.0.10, VPN_PORT: 1194 }
# -> define DC = 10.100.0.10
nftables_defines: {}

# ---- traffic to the router itself (input chain) ----
# Runs after: invalid drop, established/related accept, loopback accept.
# Anything not accepted is logged and dropped. Order matters, and setting this
# in the inventory REPLACES the whole list.
nftables_input_rules:
  - meta l4proto { icmp, ipv6-icmp } accept
  - iifname $INSIDE_IFS tcp dport 22 accept

# ---- NAT ----
# Zone whose interface inside networks are masqueraded out of ("" = no NAT)
nftables_masquerade_zone: ""

# Port forwards into an inside host. Each also needs an accept in the
# destination zone's to_rules, e.g.
#   iifname $WAN_IF ip daddr 10.100.0.20 tcp dport 443 ct status dnat accept
#   nftables_port_forwards:
#     - { port: 443, to: 10.100.0.20 }                         # tcp by default
#     - { proto: udp, port: 51820, to: 10.100.0.30, to_port: 51820, zone: wan }
nftables_port_forwards: []

# ---- routing ----
# Set true on routers: turns on net.ipv4.ip_forward
nftables_ip_forward: false

# ---- safety ----
# If Ansible can't reconnect after loading a new ruleset, the previous ruleset
# is restored automatically after this many seconds.
nftables_rollback_seconds: 120

# Stop, disable and mask firewalld / ufw if present - they fight with
# a hand-managed ruleset ("flush ruleset" wipes their tables and vice versa).
nftables_disable_other_firewalls: true

# Load the ruleset even if no file changed (e.g. after someone ran "nft flush")
nftables_force_apply: false

# ---- misc ----
nftables_include_dir: /etc/nftables.d
nftables_log_limit: 10/minute