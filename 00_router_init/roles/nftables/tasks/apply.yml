---
# Load the new ruleset like a "commit confirmed":
#   1. save the running ruleset
#   2. arm a timer that restores it in nftables_rollback_seconds
#   3. load the new ruleset
#   4. open a NEW connection to the host
#   5. if that works, disarm the timer
# If the new rules cut Ansible off, step 4 fails and the timer restores the old
# rules. The files on disk are the new version, so fix the inventory and rerun.

# Last line of defence: the exact files that are about to be loaded must parse.
- name: Check the live ruleset files
  ansible.builtin.command: nft -c -f {{ nftables_conf }}
  changed_when: false

- name: Save the running ruleset for rollback
  ansible.builtin.shell: "{ echo 'flush ruleset'; nft list ruleset; } > /run/nftables-rollback.nft"
  changed_when: false

- name: Clear any rollback timer left from an earlier run
  ansible.builtin.systemd:
    name: nftables-rollback.timer
    state: stopped
  failed_when: false

- name: Arm rollback to the saved ruleset (fires after nftables_rollback_seconds)
  ansible.builtin.command: >-
    systemd-run --unit=nftables-rollback --collect
    --on-active={{ nftables_rollback_seconds }}
    /usr/sbin/nft -f /run/nftables-rollback.nft
  changed_when: true

- name: Load the new ruleset
  ansible.builtin.command: nft -f {{ nftables_conf }}
  changed_when: true

- name: Drop the existing connection
  ansible.builtin.meta: reset_connection

- name: Reconnect through the new firewall (old rules return after the rollback delay if this fails)
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Keep the new ruleset (disarm rollback)
  ansible.builtin.systemd:
    name: nftables-rollback.timer
    state: stopped